<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub</title>

    <style>
        body {
            margin: 0;
            background: #10111b;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 24px 8%;
            background: #191a29;
            border-bottom: 1px solid #303147;
        }

        header h1 {
            margin: 0;
            color: #8b7cff;
        }

        main {
            padding: 70px 8%;
        }

        h2 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        p {
            color: #b8bad0;
            line-height: 1.7;
        }

        .games {
            margin-top: 40px;
            padding: 28px;
            background: #191a29;
            border-radius: 16px;
        }
    </style>
</head>

<body>

    <header>
        <h1>GameHub</h1>
    </header>

    <main>
        <h2>Welcome to GameHub</h2>

        <p>
            Discover games, share your reviews
            and connect with other gamers.
        </p>

        <section class="games">
            <h3>Your gaming community starts here.</h3>
            <p>Popular games and reviews will appear here soon.</p>
        </section>
    </main>

</body>
</html>
