
{% extends 'games/base.html' %}
{% load static %}

{% block title %}Search | GameHub{% endblock %}

{% block content %}

<section
    class="search-page"
    id="search-page-app"
    data-api-url="{% url 'search_results' %}"
>

    <div class="search-page-header">

        <p class="search-page-label">
            SEARCH & FILTER
        </p>

        <h1>Explore Games</h1>

        <p>
            Search, filter and discover games.
        </p>

    </div>

    <!-- SEARCH AND FILTER CONTROLS -->
    <form
        id="search-page-form"
        class="search-page-filters"
        method="get"
        action="{% url 'search_results' %}"
    >

        <input
            type="search"
            id="search-page-query"
            name="q"
            placeholder="Search games..."
            value="{{ query }}"
            autocomplete="off"
            aria-label="Search games"
        >

        <select
            id="search-page-genre"
            name="genre"
            aria-label="Filter by genre"
        >
            <option value="">All genres</option>
        </select>

        <select
            id="search-page-sort"
            name="sort"
            aria-label="Sort games"
        >
            <option value="title">Name A-Z</option>
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
        </select>

    </form>

    <!-- JAVASCRIPT STATUS -->
    <p id="search-page-count"
       aria-live="polite">
        Loading games...
    </p>

    <!-- GAME CARDS CREATED BY JAVASCRIPT -->
    <div
        id="search-page-grid"
        class="search-page-grid"
        aria-busy="true"
    ></div>

</section>

<script
    src="{% static 'games/js/search-results.js' %}"
    defer>
</script>

{% endblock %}
